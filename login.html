
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferremax - Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
    <!-- Version de esta pagina (window.VERSION_APP), para el registro de fallos.
         Sin detector: el login lleva al catalogo, que lo tiene -->
    <script src="js/version-app.js"></script>

    <!-- Scripts en orden -->
    <!-- <script src="js/config.js"></script>-->
    <!-- <script src="js/loginManager.js"></script> -->

</head>

<body>


    <div class="login-container">
        <div class="login-content">
            <h1>Acceso a Catálogo</h1>
            
            <div class="input-group">
                <input type="password" id="password" required autofocus>
                <label>contraseña</label>
                <button type="submit" id="submitBtn">
                    <svg viewBox="0 0 24 24" class="check-icon">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                </button>
            </div>

            <div class="logo-container">
                <img src="./img/logo-ferremax.png" alt="Ferremax" class="logo">
            </div>
        </div>
    </div>

            <!-- REEMPLAZA TODO EL <script type="module"> por este código -->
        <script type="module">
            import{config} from './js/config.js';
            import LoginManager from './js/loginManager.js';
            import { registrarFallo } from './js/registro-fallos.js';

            // CONFIGURACIÓN DEL FORMULARIO DE GOOGLE
            const FORM_CONFIG = {
                formUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSe2yUCt1bsXCtDKuszT9w7YdoirZdN0s4vbL4D6vmNcxMkYag/formResponse',
                fields: {
                    timestamp: 'entry.915178470',
                    clave: 'entry.1332734028',
                    nombre: 'entry.432700069',
                    exito: 'entry.1139624667',
                    dispositivo: 'entry.1634836979',
                    so: 'entry.1106116579',
                    navegador: 'entry.379104854',
                    ip: 'entry.2031547603',
                    ubicacion: 'entry.202009098'
                }
            };

            // FUNCIÓN PARA DETECTAR INFORMACIÓN DEL DISPOSITIVO
            function detectarDispositivo() {
                const ua = navigator.userAgent;
                
                let tipoDispositivo = 'Desktop';
                if (/Mobile|Android|iPhone/i.test(ua) && !/iPad|Tablet/i.test(ua)) {
                    tipoDispositivo = 'Mobile';
                } else if (/iPad|Tablet/i.test(ua)) {
                    tipoDispositivo = 'Tablet';
                }
                
                let sistemaOperativo = 'Desconocido';
                if (/Windows NT 10/i.test(ua)) sistemaOperativo = 'Windows 10';
                else if (/Windows NT 11/i.test(ua)) sistemaOperativo = 'Windows 11';
                else if (/Windows/i.test(ua)) sistemaOperativo = 'Windows';
                else if (/Mac OS X (\d+[._]\d+)/i.test(ua)) {
                    const version = ua.match(/Mac OS X (\d+[._]\d+)/i)[1].replace('_', '.');
                    sistemaOperativo = `macOS ${version}`;
                }
                else if (/Android (\d+)/i.test(ua)) {
                    const version = ua.match(/Android (\d+)/i)[1];
                    sistemaOperativo = `Android ${version}`;
                }
                else if (/iPhone OS (\d+)/i.test(ua)) {
                    const version = ua.match(/iPhone OS (\d+)/i)[1];
                    sistemaOperativo = `iOS ${version}`;
                }
                else if (/Linux/i.test(ua)) sistemaOperativo = 'Linux';
                
                let navegador = 'Desconocido';
                if (/Edg\//i.test(ua)) {
                    const version = ua.match(/Edg\/(\d+)/i)[1];
                    navegador = `Edge ${version}`;
                } else if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) {
                    const version = ua.match(/Chrome\/(\d+)/i)[1];
                    navegador = `Chrome ${version}`;
                } else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) {
                    const version = ua.match(/Version\/(\d+)/i)?.[1] || 'Unknown';
                    navegador = `Safari ${version}`;
                } else if (/Firefox/i.test(ua)) {
                    const version = ua.match(/Firefox\/(\d+)/i)[1];
                    navegador = `Firefox ${version}`;
                }
                
                return {
                    tipo: tipoDispositivo,
                    so: sistemaOperativo,
                    navegador: navegador
                };
            }

            // FUNCIÓN PARA OBTENER IP Y UBICACIÓN
            // Límite propio de 2 segundos: si ipapi.co falla o no responde a
            // tiempo, el registro sale igual con 'sin dato', para distinguir
            // en la planilla un fallo del servicio de un registro normal
            async function obtenerIPyUbicacion() {
                const control = new AbortController();
                const corte = setTimeout(() => control.abort(), 2000);
                try {
                    const response = await fetch('https://ipapi.co/json/', { signal: control.signal });
                    const data = await response.json();
                    
                    let ubicacion = '';
                    if (data.city) ubicacion += data.city;
                    if (data.region && ubicacion) ubicacion += ', ' + data.region;
                    if (data.country_name) {
                        if (ubicacion) ubicacion += ', ';
                        ubicacion += data.country_name;
                    }
                    
                    return {
                        ip: data.ip || 'IP no disponible',
                        ubicacion: ubicacion || 'Ubicación no disponible'
                    };
                } catch (error) {
                    console.warn('IP y ubicación no disponibles:',
                        error.name === 'AbortError' ? 'tiempo agotado' : error);
                    return { ip: 'sin dato', ubicacion: 'sin dato' };
                } finally {
                    clearTimeout(corte);
                }
            }

            // Se pide al cargar la página, mientras el usuario escribe la
            // clave: al terminar el login ya suele estar lista. Si el login
            // termina antes, queda registrado 'sin dato'
            let geoData = { ip: 'sin dato', ubicacion: 'sin dato' };
            let geoPedida = false;

            function iniciarGeo() {
                if (geoPedida) return;
                geoPedida = true;
                obtenerIPyUbicacion().then(g => { geoData = g; });
            }

            // FUNCIÓN PARA BUSCAR NOMBRE DEL CLIENTE
            async function buscarNombreCliente(clave) {
                try {
                    const response = await fetch('./json/clientes_permisos.json');
                    const clientesData = await response.json();
                    
                    const claveStr = String(clave).trim();
                    
                    if (clientesData[claveStr]) {
                        return clientesData[claveStr].name;
                    }
                    
                    return 'DESCONOCIDO';
                } catch (error) {
                    console.error('Error buscando nombre del cliente:', error);
                    return 'DESCONOCIDO';
                }
            }

            // FUNCIÓN PARA REGISTRAR EN GOOGLE FORMS
            // REGISTRO DE ACCESO: no demora la entrada. Usa la IP y la
            // ubicación que ya hayan llegado ('sin dato' si no) y envía con
            // sendBeacon, que el navegador completa aunque la página cambie
            function registrarAcceso(clave, nombreCliente, exito) {
                try {
                    const dispositivo = detectarDispositivo();

                    const ahora = new Date();
                    const opciones = {
                        timeZone: 'America/Argentina/Buenos_Aires',
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    };
                    const fechaHora = ahora.toLocaleString('es-AR', opciones);
                    
                    // Crear FormData (necesario para Google Forms)
                    const formData = new FormData();
                    formData.append(FORM_CONFIG.fields.timestamp, fechaHora);
                    formData.append(FORM_CONFIG.fields.clave, clave);
                    formData.append(FORM_CONFIG.fields.nombre, nombreCliente);
                    formData.append(FORM_CONFIG.fields.exito, exito ? 'SÍ' : 'NO');
                    formData.append(FORM_CONFIG.fields.dispositivo, dispositivo.tipo);
                    formData.append(FORM_CONFIG.fields.so, dispositivo.so);
                    formData.append(FORM_CONFIG.fields.navegador, dispositivo.navegador);
                    formData.append(FORM_CONFIG.fields.ip, geoData.ip);
                    formData.append(FORM_CONFIG.fields.ubicacion, geoData.ubicacion);
                    
                    // sendBeacon sobrevive al cambio de página; si no está o lo
                    // rechaza, fetch con keepalive cumple la misma función
                    const enviado = navigator.sendBeacon?.(FORM_CONFIG.formUrl, formData);
                    if (!enviado) {
                        fetch(FORM_CONFIG.formUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            keepalive: true,
                            body: formData
                        }).catch(error => {
                            console.error('Error enviando a Google Forms:', error);
                        });
                    }

                    console.log('Registro de acceso enviado', enviado ? '(beacon)' : '(fetch keepalive)');
                    
                } catch (error) {
                    console.error('Error en registrarAcceso:', error);
                }
            }

            // INICIALIZACIÓN AL CARGAR LA PÁGINA
            document.addEventListener('DOMContentLoaded', function() {
                
                document.getElementById('password').focus();

                // IP y ubicación para el registro de acceso: se piden ya, con
                // límite de 2 segundos, para no esperarlas al entrar
                iniciarGeo();

                // Warm-up: despertar el endpoint mientras el usuario escribe.
                // No bloquea nada; si falla, se ignora.
                fetch('https://script.google.com/macros/s/AKfycbzuT4PB1Rqw935-AkjtMnd_nR0lR-bWQS56Dbvh-jVi-P-n0Kdca1Rez61DsYxc7f8/exec?accion=ping')
                    .then(() => console.log('[LOGIN] Endpoint despierto'))
                    .catch(() => {});
                const loginManager = new LoginManager();

                // EVENTO CLICK EN BOTÓN DE LOGIN
                document.getElementById('submitBtn').addEventListener('click', async function(e) {
                    const btn = this;
                    if (btn.disabled) return;

                    // Indicador de progreso: el endpoint tarda 1-2 segundos
                    const iconoOriginal = btn.innerHTML;
                    btn.disabled = true;
                    btn.classList.add('cargando');
                    btn.innerHTML = '<div class="spinner-login"></div>';

                    try {
                        const clave = document.getElementById('password').value;
                        const nombreCliente = await buscarNombreCliente(clave);
                        const loginSuccess = await loginManager.processLogin(clave);

                        // Registrar el acceso (exitoso o no) sin demorar la
                        // entrada: el envío sigue aunque la página cambie
                        registrarAcceso(clave, nombreCliente, loginSuccess);

                        if (loginSuccess) {
                            window.location.href = 'catalogo.html';
                            return; // no restaurar: la pagina cambia
                        }

                        alert('Clave incorrecta');
                    } catch (err) {
                        console.error('[LOGIN] Error:', err);
                        alert('No se pudo iniciar sesion. Intente de nuevo.');
                    }

                    // Restaurar el boton para poder reintentar
                    btn.disabled = false;
                    btn.classList.remove('cargando');
                    btn.innerHTML = iconoOriginal;
                });

                // EVENTO ENTER EN INPUT
                document.getElementById('password').addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        document.getElementById('submitBtn').click();
                    }
                });
            });
        </script>

</body>
</html>
