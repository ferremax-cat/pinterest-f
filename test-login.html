<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Login Ferremax</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    input { padding: 8px; margin-bottom: 12px; font-family: monospace; }
    #url { width: 100%; }
    button { padding: 10px 18px; margin: 6px 6px 6px 0; cursor: pointer; }
    pre { background: #f4f4f4; padding: 14px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
    .ok { color: #0a0; font-weight: bold; }
    .err { color: #c00; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Test de login — Ferremax API</h2>

  <label>URL del despliegue:</label><br>
  <input id="url" placeholder="https://script.google.com/macros/s/.../exec"><br>

  <label>Clave:</label><br>
  <input id="clave" placeholder="1218">
  <button onclick="login()">Entrar</button>
  <button onclick="validar()">Validar token guardado</button>
  <button onclick="verToken()">Ver contenido del token</button>

  <pre id="salida">Pegá la URL y probá una clave.</pre>

<script>
const salida = document.getElementById('salida');
let ultimoToken = null;

function log(txt, clase) {
  salida.innerHTML += `\n<span class="${clase || ''}">${txt}</span>`;
}

async function postear(cuerpo) {
  const url = document.getElementById('url').value.trim();
  if (!url.endsWith('/exec')) {
    salida.textContent = '';
    log('ERROR: la URL debe terminar en /exec', 'err');
    return null;
  }

  const t0 = performance.now();
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(cuerpo)
  });
  const data = await resp.json();
  data._ms = Math.round(performance.now() - t0);
  return data;
}

async function login() {
  salida.textContent = 'Enviando login...';
  try {
    const data = await postear({ accion: 'login', clave: document.getElementById('clave').value });
    if (!data) return;

    if (data.ok) {
      ultimoToken = data.token;
      log(`\nLOGIN OK en ${data._ms} ms`, 'ok');
      log(`Nombre: ${data.nombre}`);
      log(`Rol:    ${data.rol}`);
      log(`Codigo: ${data.codigo || '(vacio)'}`);
      log(`Vence:  ${new Date(data.vence).toLocaleString('es-AR')}`);
      log(`\nToken: ${data.token}`);
    } else {
      log(`\nRECHAZADO en ${data._ms} ms: ${data.error}`, 'err');
    }
  } catch (err) {
    log('\nFALLO: ' + err, 'err');
  }
}

async function validar() {
  if (!ultimoToken) { salida.textContent = ''; log('Primero hace login', 'err'); return; }
  salida.textContent = 'Validando token...';
  try {
    const data = await postear({ accion: 'validar', token: ultimoToken });
    log(`\n${data.ok ? 'TOKEN VALIDO' : 'TOKEN INVALIDO'} (${data._ms} ms)`, data.ok ? 'ok' : 'err');
    log(JSON.stringify(data, null, 2));
  } catch (err) {
    log('\nFALLO: ' + err, 'err');
  }
}

function verToken() {
  if (!ultimoToken) { salida.textContent = ''; log('Primero hace login', 'err'); return; }
  const p = ultimoToken.split('.')[0];
  salida.textContent = 'Contenido del token (legible, pero no alterable):\n\n';
  log(atob(p.replace(/-/g, '+').replace(/_/g, '/')));
}
</script>
</body>
</html>
