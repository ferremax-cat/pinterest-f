name: Update JSONs
on:
  push:
    paths:
      - 'excel/*.xlsx'    # Se activa cuando se modifican archivos Excel
  schedule:
    #- cron: '* * * * *'   # Se ejecuta cada minuto    
    
    - cron: '0 * * * *' # Para ejecutarse cada hora
  workflow_dispatch:      # Esto habilita la ejecución manual  

# Una sola corrida a la vez (un push de Excel puede coincidir con la de cada hora):
# la siguiente espera a que termine la anterior en lugar de pisar su push
concurrency:
  group: update-json
  cancel-in-progress: false

jobs:
  convert-excel-to-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install pandas openpyxl requests   # Agregado requests aquí
          
      - name: Convert Excel to JSON
        run: python scripts/excel_to_json.py

      # Índice del buscador v2 (solo biblioteca estándar). Si falla, por ejemplo por
      # un caso de normalización, quedan el índice anterior y su huella, y los
      # demás datos se commitean igual; el último paso deja el run en rojo
      - name: Generar índice de búsqueda v2
        id: indice
        continue-on-error: true
        run: |
          # Copia del índice publicado: su diccionario sirve de respaldo si los casos fallan
          cp json/search/v2/indice.json "$RUNNER_TEMP/indice_anterior.json" 2>/dev/null || true
          python generar_indice_busqueda.py

      - name: Setup Node
        if: steps.indice.outcome == 'success'
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Casos de búsqueda (casos_busqueda.json) contra el índice recién generado.
      # Si fallan y la causa es el diccionario nuevo (el mismo catálogo con el
      # diccionario anterior falla menos), se publica el índice con el diccionario
      # anterior; si no, el índice nuevo. Los demás datos se commitean igual y el
      # último paso deja el run en rojo, con el detalle en el resumen
      - name: Probar búsquedas
        id: busquedas
        if: steps.indice.outcome == 'success'
        continue-on-error: true
        run: |
          node js/search/v2/probar_busquedas.js --resumen "$GITHUB_STEP_SUMMARY" && exit 0
          if [ -f "$RUNNER_TEMP/indice_anterior.json" ] \
             && python generar_indice_busqueda.py --grupos-de "$RUNNER_TEMP/indice_anterior.json" \
                  --salida "$RUNNER_TEMP/indice_dic_anterior.json" \
             && node js/search/v2/probar_busquedas.js --culpa-del-diccionario "$RUNNER_TEMP/indice_dic_anterior.json" \
                  --resumen "$GITHUB_STEP_SUMMARY"; then
            python generar_indice_busqueda.py --grupos-de "$RUNNER_TEMP/indice_anterior.json"
          fi
          exit 1

      - name: Commit JSON files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/*.json json/search/v2/indice.json
          # Solo intenta hacer commit si hay cambios
          git diff --staged --quiet || (git commit -m "Update JSONs from Excel" && git push)
          
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          branch: ${{ github.ref }}

      # Después de commitear lo demás: si el índice no se pudo generar o fallaron
      # casos de búsqueda, el run queda fallido (aviso por mail) con el detalle
      - name: Avisar si falló el buscador
        if: steps.indice.outcome == 'failure' || steps.busquedas.outcome == 'failure'
        run: |
          if [ "${{ steps.indice.outcome }}" = "failure" ]; then
            echo "::error::No se pudo generar json/search/v2/indice.json; quedó el índice anterior. Ver el paso 'Generar índice de búsqueda v2'."
          fi
          if [ "${{ steps.busquedas.outcome }}" = "failure" ]; then
            echo "::error::Fallaron casos de búsqueda. El detalle y qué índice se publicó están en el resumen de la corrida (Summary)."
          fi
          exit 1